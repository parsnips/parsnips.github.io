<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs";

  mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });

  const blocks = document.querySelectorAll(
    'pre code.language-mermaid, .language-mermaid pre code, pre code[data-lang="mermaid"]'
  );

  for (const [index, code] of Array.from(blocks).entries()) {
    const source = code.closest(".highlighter-rouge") || code.closest("pre");
    try {
      const { svg, bindFunctions } = await mermaid.render(`mermaid-diagram-${index}`, code.textContent);
      const diagram = document.createElement("div");
      diagram.className = "mermaid-diagram";
      diagram.innerHTML = svg;
      source.replaceWith(diagram);
      bindFunctions?.(diagram);
    } catch (error) {
      console.error("Could not render Mermaid diagram; leaving its source visible.", error);
    }
  }
</script>
